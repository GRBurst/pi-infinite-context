<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title description">
  <title id="title">A summary represents a preserved, nested archive</title>
  <desc id="description">On the left, the model receives a message, Summary B, and another message, in order from top to bottom. Summary B represents Fold B in the archive on the right. Each fold has a summary in its header and ordered children below it. Fold B has Summary B and contains an original message, the earlier Fold A, and another original message. Fold A has Summary A and contains two original messages. A summary belongs to its fold; it is not another child.</desc>

  <!-- KISS: vertical sequences and nested boundaries show order and containment without a legend. -->
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; fill: #1f2328; }
    .heading { font-weight: 650; }
    .center { text-anchor: middle; }
    .note { font-size: 18px; fill: #59636e; }
    .message { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .summary-b { fill: #e4f5ed; stroke: #347d59; stroke-width: 1.5; }
    .fold-b { fill: #f5fbf7; stroke: #347d59; stroke-width: 1.5; }
    .fold-a { fill: #f0f6ff; stroke: #3973ac; stroke-width: 1.5; }
    .header-b { stroke: #347d59; stroke-width: 1.5; }
    .header-a { stroke: #3973ac; stroke-width: 1.5; }
    .line { fill: none; stroke: #8c959f; stroke-width: 2; }
    .reference { fill: none; stroke: #347d59; stroke-width: 2; }
    .arrow { fill: #347d59; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .note { fill: #b1bac4; }
      .message { fill: #212830; stroke: #919ba5; }
      .summary-b { fill: #19382f; stroke: #62b38f; }
      .fold-b { fill: #14271f; stroke: #62b38f; }
      .fold-a { fill: #182c43; stroke: #79b8ff; }
      .header-b { stroke: #62b38f; }
      .header-a { stroke: #79b8ff; }
      .line { stroke: #919ba5; }
      .reference { stroke: #62b38f; }
      .arrow { fill: #62b38f; }
    }
  </style>
  <defs>
    <marker id="reference-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>

  <text class="heading" x="24" y="36">Context sent to the model</text>
  <text class="heading" x="384" y="36">Archive</text>

  <path class="line" d="M 146 256 V 514"/>
  <rect class="message" x="24" y="182" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="227">Message</text>
  <rect class="summary-b" x="24" y="348" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="393">Summary B</text>
  <rect class="message" x="24" y="514" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="559">Message</text>

  <!-- The Map Is Not the Territory: the summary references the entire archived fold, not one of its children. -->
  <text class="note center" x="326" y="370">represents</text>
  <path class="reference" d="M 268 385 H 384" marker-end="url(#reference-arrow)"/>

  <!-- A fold's summary is a node property, separate from its ordered children (DESIGN.md). -->
  <rect class="fold-b" x="384" y="70" width="512" height="626" rx="12"/>
  <text class="heading" x="408" y="110">Fold B</text>
  <text x="408" y="146">Summary B</text>
  <line class="header-b" x1="384" y1="162" x2="896" y2="162"/>
  <path class="line" d="M 640 246 V 594"/>
  <rect class="message" x="424" y="182" width="432" height="64" rx="8"/>
  <text class="center" x="640" y="222">Message</text>

  <!-- Favor Immutability: Fold A remains one complete child, including its summary and original messages. -->
  <rect class="fold-a" x="424" y="282" width="432" height="276" rx="10"/>
  <text class="heading" x="448" y="322">Fold A</text>
  <text x="448" y="358">Summary A</text>
  <line class="header-a" x1="424" y1="374" x2="856" y2="374"/>
  <path class="line" d="M 640 454 V 482"/>
  <rect class="message" x="454" y="394" width="372" height="60" rx="7"/>
  <text class="center" x="640" y="432">Message</text>
  <rect class="message" x="454" y="482" width="372" height="60" rx="7"/>
  <text class="center" x="640" y="520">Message</text>

  <rect class="message" x="424" y="594" width="432" height="64" rx="8"/>
  <text class="center" x="640" y="634">Message</text>
</svg>
