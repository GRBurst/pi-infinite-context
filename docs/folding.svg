<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title description">
  <title id="title">A summary represents a preserved, nested archive</title>
  <desc id="description">On the left, the model receives a message, Summary B, and another message, in order from top to bottom. Summary B represents Fold B in the archive on the right. Fold B keeps a message, the earlier Fold A, and another message, in the same order. Fold A keeps Summary A and its two original messages. Existing folds and messages stay unchanged.</desc>

  <!-- KISS: vertical sequences and nested boundaries show order and containment without a legend. -->
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; fill: #1f2328; }
    .heading { font-weight: 650; }
    .center { text-anchor: middle; }
    .note { font-size: 18px; fill: #59636e; }
    .message { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .summary-b { fill: #e4f5ed; stroke: #347d59; stroke-width: 1.5; }
    .fold-b { fill: #f5fbf7; stroke: #347d59; stroke-width: 1.5; }
    .fold-a { fill: #f0f6ff; stroke: #3973ac; stroke-width: 1.5; }
    .line { fill: none; stroke: #8c959f; stroke-width: 2; }
    .reference { fill: none; stroke: #347d59; stroke-width: 2; }
    .arrow { fill: #347d59; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .note { fill: #b1bac4; }
      .message { fill: #212830; stroke: #919ba5; }
      .summary-b { fill: #19382f; stroke: #62b38f; }
      .fold-b { fill: #14271f; stroke: #62b38f; }
      .fold-a { fill: #182c43; stroke: #79b8ff; }
      .line { stroke: #919ba5; }
      .reference { stroke: #62b38f; }
      .arrow { fill: #62b38f; }
    }
  </style>
  <defs>
    <marker id="reference-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="arrow" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>

  <text class="heading" x="24" y="36">Sent to the model</text>
  <text class="heading" x="384" y="36">Archive · unchanged</text>

  <path class="line" d="M 146 224 V 426"/>
  <rect class="message" x="24" y="150" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="195">Message</text>
  <rect class="summary-b" x="24" y="288" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="333">Summary B</text>
  <rect class="message" x="24" y="426" width="244" height="74" rx="8"/>
  <text class="center" x="146" y="471">Message</text>

  <!-- The Map Is Not the Territory: the summary references the entire archived fold, not one of its children. -->
  <text class="note center" x="326" y="310">represents</text>
  <path class="reference" d="M 268 325 H 384" marker-end="url(#reference-arrow)"/>

  <rect class="fold-b" x="384" y="70" width="512" height="556" rx="12"/>
  <text class="heading" x="408" y="110">Fold B</text>
  <path class="line" d="M 640 208 V 520"/>
  <rect class="message" x="424" y="140" width="432" height="68" rx="8"/>
  <text class="center" x="640" y="182">Original message</text>

  <!-- Favor Immutability: Fold A remains one complete child, including its summary and original messages. -->
  <rect class="fold-a" x="424" y="244" width="432" height="240" rx="10"/>
  <text class="heading" x="448" y="280">Fold A · Summary A</text>
  <path class="line" d="M 640 372 V 402"/>
  <rect class="message" x="454" y="314" width="372" height="58" rx="7"/>
  <text class="center" x="640" y="351">Original message</text>
  <rect class="message" x="454" y="402" width="372" height="58" rx="7"/>
  <text class="center" x="640" y="439">Original message</text>

  <rect class="message" x="424" y="520" width="432" height="68" rx="8"/>
  <text class="center" x="640" y="562">Original message</text>
</svg>
